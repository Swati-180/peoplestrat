services:
  - type: web
    name: ai-workforce-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://peoplestrat.vercel.app
      - key: MAYAMAYA_API_KEY
        sync: false
      - key: MAYAMAYA_BASE_URL
        value: https://developers-api-01.mayamaya.ai
      - key: MAYAMAYA_WEBHOOK_URL
        sync: false
      - key: MAYAMAYA_EMBED_ORIGIN
        value: https://peoplestrat.vercel.app
